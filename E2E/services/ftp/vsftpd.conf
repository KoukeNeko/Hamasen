# vsftpd for the e2e FTP service: plain FTP and explicit FTPS (AUTH TLS) on
# one port, passive data on 30000-30049 announced as 127.0.0.1 so data
# connections from the host reach the published ports.
listen=YES
listen_ipv6=NO
background=NO
seccomp_sandbox=NO

anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
chroot_local_user=YES
allow_writeable_chroot=YES

pasv_enable=YES
pasv_min_port=30000
pasv_max_port=30049
pasv_address=127.0.0.1
# Control connections through toxiproxy come from its address while data
# connections come straight from the host.
pasv_promiscuous=YES

ssl_enable=YES
allow_anon_ssl=NO
force_local_logins_ssl=NO
force_local_data_ssl=NO
require_ssl_reuse=NO
ssl_ciphers=HIGH
rsa_cert_file=/tls/server.pem
rsa_private_key_file=/tls/server-key.pem

idle_session_timeout=86400
data_connection_timeout=3600
