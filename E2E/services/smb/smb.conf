# Samba for the e2e SMB service: SMB2.1 and later on port 445 only, NTLMv2
# password logins, one share "data" writable by hamasen.
[global]
    server role = standalone server
    server min protocol = SMB2_10
    disable netbios = yes
    smb ports = 445
    ntlm auth = ntlmv2-only
    map to guest = never
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes

[data]
    path = /data
    read only = no
    valid users = hamasen
