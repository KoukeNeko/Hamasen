name: App Store release

# Apple refuses a binary whose BuildMachineOSBuild names a beta macOS
# (ITMS-90301, "not currently accepting applications built with this version
# of the OS"). The maintainer's Mac runs a beta, so the shipping build is made
# here: the macos-26 runner carries the same Xcode 26.6 (17F113) on a released
# macOS, which changes that one field and nothing else about the toolchain.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Build number, higher than the last one App Store Connect accepted
        required: true
        type: string
      upload:
        description: Upload to App Store Connect (off keeps the package as an artifact only)
        required: true
        type: boolean
        default: false

env:
  ARCHIVE_PATH: ${{ github.workspace }}/build/Hamasen.xcarchive
  EXPORT_DIR: ${{ github.workspace }}/build/export

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      # Pinned rather than left to the image default, so a runner-image
      # refresh cannot change the toolchain under a shipping build. The glob
      # absorbs the image's choice between Xcode_26.6.app and Xcode_26.6.0.app.
      - name: Pin the Xcode version
        run: |
          xcode_app="$(ls -d /Applications/Xcode_26.6*.app 2>/dev/null | sort -V | tail -1)"
          if [[ -z "${xcode_app}" ]]; then
              echo "error: Xcode 26.6 is not installed on this runner image" >&2
              ls -d /Applications/Xcode*.app >&2
              exit 1
          fi
          sudo xcode-select --switch "${xcode_app}/Contents/Developer"
          xcodebuild -version

      # Runs before the signing key is installed so a test failure costs
      # nothing and never touches a secret.
      - name: Run the verification harness
        env:
          HAMASEN_UNSIGNED_BUILD: "1"
        run: scripts/verify.sh

      - name: Install the App Store Connect API key
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          # xcodebuild and altool both locate the key by this exact filename.
          mkdir -p "${HOME}/private_keys"
          printf '%s' "${KEY_P8_BASE64}" | base64 --decode \
              > "${HOME}/private_keys/AuthKey_${KEY_ID}.p8"
          chmod 600 "${HOME}/private_keys/AuthKey_${KEY_ID}.p8"

      # The distribution certificates are cloud-managed: no private key exists
      # on any machine, so -allowProvisioningUpdates fetches both the
      # certificate and the profiles from Apple on every run.
      - name: Archive
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild archive \
              -project Hamasen.xcodeproj \
              -scheme Hamasen \
              -configuration Release \
              -destination 'generic/platform=macOS' \
              -archivePath "${ARCHIVE_PATH}" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "${HOME}/private_keys/AuthKey_${KEY_ID}.p8" \
              -authenticationKeyID "${KEY_ID}" \
              -authenticationKeyIssuerID "${ISSUER_ID}" \
              CURRENT_PROJECT_VERSION='${{ inputs.build_number }}'

      # The whole point of building here, asserted rather than assumed. Beta
      # macOS builds carry a trailing lowercase seed letter (26A5416b); a
      # released one does not (25F84).
      - name: Assert the build machine was not running a beta macOS
        run: |
          info="${ARCHIVE_PATH}/Products/Applications/Hamasen.app/Contents/Info.plist"
          machine_os="$(plutil -extract BuildMachineOSBuild raw "${info}")"
          echo "BuildMachineOSBuild: ${machine_os}"
          if [[ "${machine_os}" =~ [a-z]$ ]]; then
              echo "error: built on a beta macOS; Apple would reject this with ITMS-90301" >&2
              exit 1
          fi

      - name: Export the installer package
        run: |
          cat > "${RUNNER_TEMP}/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>33832Z66QU</string>
              <key>destination</key>
              <string>export</string>
              <!-- Left to itself, exportArchive rewrites the build number and
                   the input above would be silently ignored. -->
              <key>manageAppVersionAndBuildNumber</key>
              <false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
              -archivePath "${ARCHIVE_PATH}" \
              -exportPath "${EXPORT_DIR}" \
              -exportOptionsPlist "${RUNNER_TEMP}/ExportOptions.plist" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "${HOME}/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" \
              -authenticationKeyID '${{ secrets.ASC_KEY_ID }}' \
              -authenticationKeyIssuerID '${{ secrets.ASC_ISSUER_ID }}'

      - name: Keep the package
        uses: actions/upload-artifact@v7
        with:
          name: Hamasen-${{ inputs.build_number }}-pkg
          path: ${{ env.EXPORT_DIR }}/*.pkg
          if-no-files-found: error

      - name: Upload to App Store Connect
        if: ${{ inputs.upload }}
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app --type macos \
              --file "${EXPORT_DIR}/Hamasen.pkg" \
              --apiKey "${KEY_ID}" \
              --apiIssuer "${ISSUER_ID}"
